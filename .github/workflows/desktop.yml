name: Desktop Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag and versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install backend build dependencies
        run: uv sync --project backend --group desktop --frozen
      - name: Build web interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint
      - name: Package local backend
        run: backend/.venv/Scripts/python.exe scripts/package-desktop.py
      - name: Check packaged lifecycle
        run: backend/.venv/Scripts/python.exe -m unittest discover -s backend/tests -v
      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm ci
          npm run tauri -- icon icon.svg
          npm run build -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Filament-Tracker-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Filament-Tracker-Windows
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum -- *-setup.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release/*
          --verify-tag --title "Filament Tracker $RELEASE_TAG" --generate-notes
